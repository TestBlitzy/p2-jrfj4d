name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: test_db
  DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/test_db
  TEST_COVERAGE_THRESHOLD: '80'
  AI_MODEL_VERSION: ${{ vars.AI_MODEL_VERSION }}

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ~/.cache/pip
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install Node.js dependencies
        run: |
          npm ci
          npm run prisma:generate

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tensorflow==2.14.0 scikit-learn pandas numpy

      - name: Setup test database
        run: |
          npm run prisma:migrate
          npm run test:setup-db

      - name: Initialize AI models
        run: |
          python scripts/init_ai_models.py \
            --model-version ${{ env.AI_MODEL_VERSION }} \
            --data-path ./tests/fixtures/ai

      - name: Run integration tests
        run: |
          npm run test:integration -- \
            --config=jest.config.ts \
            --coverage \
            --coverageThreshold='{"global":{"branches":80,"functions":80,"lines":80,"statements":80}}' \
            --ci \
            --runInBand \
            --forceExit \
            --detectOpenHandles \
            --maxWorkers=2

      - name: Validate test coverage
        run: |
          if [ $(jq -r '.total.lines.pct' coverage/coverage-summary.json) -lt ${{ env.TEST_COVERAGE_THRESHOLD }} ]; then
            echo "Test coverage below threshold of ${{ env.TEST_COVERAGE_THRESHOLD }}%"
            exit 1
          fi

      - name: Generate test report
        if: always()
        run: |
          npm run test:report
          npm run test:coverage-report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            coverage/
            test-results/
            junit.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: integration
          name: codecov-integration
          fail_ci_if_error: true

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const { repo, owner } = context.repo;
            const run_id = context.runId;
            const run_url = `https://github.com/${owner}/${repo}/actions/runs/${run_id}`;
            const message = `❌ Integration tests failed in ${context.workflow}\n${run_url}`;
            
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: message
            });