<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Primary Meta Tags -->
    <meta name="description" content="Enterprise-grade AI-driven Sales & Intelligence Platform for enhanced decision-making, automated lead generation, and data-driven customer insights">
    <meta name="keywords" content="sales intelligence, AI sales, lead generation, sales automation, business intelligence, revenue forecasting, market analysis">
    <meta name="author" content="Sales & Intelligence Platform">
    <meta name="application-name" content="Sales & Intelligence Platform">
    
    <!-- PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Sales & Intelligence Platform">
    <meta property="og:description" content="AI-driven sales optimization platform for 150% business growth">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/assets/og-image.png">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sales & Intelligence Platform">
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.example.com; script-src 'self' 'nonce-${nonce}'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    
    <!-- Resource Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.example.com">
    <link rel="preload" href="/assets/critical.css" as="style">
    
    <!-- Manifest and Icons -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- Critical CSS -->
    <link rel="stylesheet" href="/src/styles/global.scss">
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    
    <title>Sales & Intelligence Platform</title>
    
    <!-- Inline Critical CSS -->
    <style>
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .skip-to-main {
            position: absolute;
            left: -9999px;
            z-index: 999;
            padding: 1em;
            background-color: white;
            color: black;
            text-decoration: none;
        }
        .skip-to-main:focus {
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <!-- Skip to main content for accessibility -->
    <a href="#root" class="skip-to-main">Skip to main content</a>
    
    <!-- Root container for React application -->
    <div id="root" role="main" aria-label="application"></div>
    
    <!-- Portal container for modals -->
    <div id="portal" role="presentation" aria-hidden="true"></div>
    
    <!-- Initial loading state -->
    <div id="loader" role="progressbar" aria-label="Loading application">
        <div class="loader"></div>
        <noscript>
            <p>JavaScript is required to run this application.</p>
        </noscript>
    </div>
    
    <!-- Main application script -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Error tracking -->
    <script>
        window.addEventListener('error', function(event) {
            console.error('Global error:', event.error);
            // Implement error tracking here
        });
    </script>
</body>
</html>
