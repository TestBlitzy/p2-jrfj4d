apiVersion: v1
kind: Service
metadata:
  name: sales-intelligence-backend
  namespace: sales-intelligence
  labels:
    app: sales-intelligence
    component: backend
    environment: production
    tier: application
  annotations:
    # Prometheus monitoring configuration
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
    # Service metadata
    service.kubernetes.io/description: "Backend API service for Sales & Intelligence Platform"
    service.kubernetes.io/version: "1.0.0"
    # Load balancing configuration
    service.kubernetes.io/load-balancer-class: "internal"
    service.kubernetes.io/algorithm: "round-robin"
spec:
  type: ClusterIP
  # Port configuration for backend service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  # Selector matching backend deployment pods
  selector:
    app: sales-intelligence
    component: backend
  # Session affinity configuration
  sessionAffinity: None
  # Publishing configuration
  publishNotReadyAddresses: false
  # Internal traffic policy
  internalTrafficPolicy: Cluster
  # Health check configuration
  healthCheckNodePort: 0
  # Load balancer configurations
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  # Ensure proper load distribution
  topologyKeys:
    - "kubernetes.io/hostname"
    - "*"