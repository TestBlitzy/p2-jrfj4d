apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: sales-intelligence
  labels:
    app: sales-intelligence
    component: config
  annotations:
    description: Application configuration for Sales & Intelligence Platform
    version: 1.0.0
    lastUpdated: "2024-01-20"
data:
  AI_CONFIG: |
    {
      "leadScoring": {
        "modelPath": "./models/lead-scoring",
        "modelVersion": "1.0.0",
        "confidenceThreshold": "0.8",
        "minTrainingData": "10000",
        "updateFrequency": "monthly",
        "tensorflow": {
          "version": "2.14.0",
          "batchSize": "32",
          "epochs": "100",
          "learningRate": "0.001",
          "optimizerType": "adam"
        }
      },
      "revenueForecasting": {
        "modelPath": "./models/revenue-forecast",
        "modelVersion": "1.0.0",
        "minHistoricalMonths": "12",
        "updateFrequency": "quarterly",
        "scikit": {
          "version": "1.3.0",
          "randomState": "42",
          "testSize": "0.2",
          "crossValidationFolds": "5"
        }
      },
      "marketIntelligence": {
        "modelPath": "./models/market-intelligence",
        "modelVersion": "1.0.0",
        "updateFrequency": "weekly",
        "bert": {
          "version": "1.0.0",
          "maxSequenceLength": "512",
          "batchSize": "16",
          "learningRate": "2e-5"
        }
      }
    }
  DATABASE_CONFIG: |
    {
      "postgres": {
        "host": "postgres-service",
        "port": "5432",
        "database": "sales_intelligence",
        "pool": {
          "min": "2",
          "max": "10",
          "idleTimeoutMillis": "30000",
          "connectionTimeoutMillis": "2000",
          "acquireTimeoutMillis": "3000",
          "reapIntervalMillis": "1000"
        },
        "ssl": {
          "rejectUnauthorized": "false",
          "mode": "require"
        },
        "queryTimeout": "5000"
      },
      "redis": {
        "host": "redis-service",
        "port": "6379",
        "keyPrefix": "sip:",
        "maxRetriesPerRequest": "3",
        "enableReadyCheck": "true",
        "retryStrategy": {
          "maxAttempts": "5",
          "initialDelay": "1000",
          "maxDelay": "3000"
        },
        "cluster": {
          "enabled": "true",
          "nodes": "3"
        }
      }
    }
  AUTH_CONFIG: |
    {
      "jwt": {
        "accessTokenExpiry": "3600",
        "refreshTokenExpiry": "604800",
        "algorithm": "HS256",
        "issuer": "sales-intelligence-platform",
        "audience": "sip-users"
      },
      "oauth": {
        "google": {
          "callbackUrl": "/auth/google/callback",
          "scopes": ["profile", "email", "openid"],
          "responseType": "code",
          "prompt": "consent"
        },
        "microsoft": {
          "callbackUrl": "/auth/microsoft/callback",
          "scopes": ["user.read", "email", "offline_access"],
          "responseType": "code",
          "prompt": "consent"
        }
      },
      "mfa": {
        "enabled": "true",
        "type": "TOTP",
        "issuer": "Sales & Intelligence Platform",
        "digits": "6",
        "step": "30",
        "window": "1"
      },
      "session": {
        "store": "redis",
        "prefix": "sess:",
        "expiry": "86400",
        "rolling": "true",
        "secure": "true",
        "httpOnly": "true"
      },
      "rbac": {
        "roles": ["ADMIN", "MANAGER", "SALES_REP"],
        "defaultRole": "SALES_REP",
        "superAdmin": "ADMIN",
        "permissions": {
          "ADMIN": ["all"],
          "MANAGER": ["read", "write", "delete"],
          "SALES_REP": ["read", "write"]
        }
      }
    }
  NODE_ENV: "production"
  API_VERSION: "v1"
  LOG_LEVEL: "info"