---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sales-intelligence-storage
  namespace: sales-intelligence
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    encryption.aws/kms-key-id: ${KMS_KEY_ID}
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3
  encrypted: "true"
  iops: "3000"
  throughput: "125"
  fsType: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: sales-intelligence
  labels:
    app: postgres
    tier: database
    environment: production
    backup: required
  annotations:
    backup.velero.io/backup-volumes: data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: sales-intelligence-storage
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: sales-intelligence
  labels:
    app: redis
    tier: cache
    environment: production
  spec:
    accessModes:
      - ReadWriteOnce
    storageClassName: sales-intelligence-storage
    resources:
      requests:
        storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-models-pvc
  namespace: sales-intelligence
  labels:
    app: ai-models
    tier: ml
    environment: production
    backup: required
  annotations:
    backup.velero.io/backup-volumes: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: sales-intelligence-storage
  resources:
    requests:
      storage: 50Gi