apiVersion: v1
kind: Secret
metadata:
  name: sales-intelligence-secrets
  namespace: sales-intelligence
  labels:
    app: sales-intelligence
    component: secrets
    environment: production
    managed-by: terraform
  annotations:
    kubernetes.io/created-by: terraform
    secret.kubernetes.io/managed-by: aws-kms
    secret.kubernetes.io/encryption-key: arn:aws:kms:region:account:key/key-id
    backup.velero.io/backup-volumes: exclude
    secret.kubernetes.io/rotation-schedule: "0 0 1 * *"  # Monthly rotation
    secret.kubernetes.io/last-rotated: "2024-01-20"
    security.kubernetes.io/encryption-version: "v1"
    security.kubernetes.io/audit-enabled: "true"
type: Opaque
data:
  # Database Credentials - 30 day rotation
  POSTGRES_USER: ${base64_encoded_postgres_user}
  POSTGRES_PASSWORD: ${base64_encoded_postgres_password}
  REDIS_PASSWORD: ${base64_encoded_redis_password}

  # JWT Secrets - 90 day rotation
  JWT_SECRET: ${base64_encoded_jwt_secret}
  JWT_REFRESH_SECRET: ${base64_encoded_jwt_refresh_secret}

  # OAuth Provider Credentials - 180 day rotation
  GOOGLE_CLIENT_ID: ${base64_encoded_google_client_id}
  GOOGLE_CLIENT_SECRET: ${base64_encoded_google_client_secret}
  MICROSOFT_CLIENT_ID: ${base64_encoded_microsoft_client_id}
  MICROSOFT_CLIENT_SECRET: ${base64_encoded_microsoft_client_secret}

  # Third-party API Keys - 90 day rotation
  SENDGRID_API_KEY: ${base64_encoded_sendgrid_api_key}
  SLACK_BOT_TOKEN: ${base64_encoded_slack_bot_token}
  LINKEDIN_API_KEY: ${base64_encoded_linkedin_api_key}

  # MFA Configuration
  MFA_ENCRYPTION_KEY: ${base64_encoded_mfa_encryption_key}
  MFA_ISSUER_SECRET: ${base64_encoded_mfa_issuer_secret}

  # Session Management
  SESSION_ENCRYPTION_KEY: ${base64_encoded_session_key}
  SESSION_SIGNING_KEY: ${base64_encoded_signing_key}

  # Backup and Recovery
  BACKUP_ENCRYPTION_KEY: ${base64_encoded_backup_key}
  RECOVERY_VERIFICATION_KEY: ${base64_encoded_recovery_key}

  # Monitoring and Alerting
  ALERT_WEBHOOK_SECRET: ${base64_encoded_alert_webhook_secret}
  METRICS_API_KEY: ${base64_encoded_metrics_api_key}

  # Integration Endpoints
  CRM_INTEGRATION_SECRET: ${base64_encoded_crm_secret}
  EMAIL_INTEGRATION_SECRET: ${base64_encoded_email_secret}
  ANALYTICS_INTEGRATION_SECRET: ${base64_encoded_analytics_secret}