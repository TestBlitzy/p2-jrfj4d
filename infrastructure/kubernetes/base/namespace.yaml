---
apiVersion: v1
kind: Namespace
metadata:
  name: sales-intelligence
  labels:
    name: sales-intelligence
    environment: production
    app.kubernetes.io/name: sales-intelligence
    app.kubernetes.io/part-of: sales-intelligence-platform
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: 1.0.0
    security.io/compliance-level: high
    monitoring.io/priority: critical
    backup.io/retention: 30d
    cost-center: sales-platform
  annotations:
    description: Sales & Intelligence Platform production namespace
    scheduler.alpha.kubernetes.io/node-selector: environment=production
    net.beta.kubernetes.io/network-policy: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    monitoring.io/scrape: "true"
    monitoring.io/port: metrics
    backup.io/schedule: "0 1 * * *"
    capacity.io/autoscale: enabled
    security.io/encryption: enabled
    compliance.io/audit-logging: enabled
spec:
  finalizers:
    - kubernetes
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sales-intelligence-quota
  namespace: sales-intelligence
spec:
  hard:
    requests.cpu: "24"
    requests.memory: 48Gi
    limits.cpu: "48"
    limits.memory: 96Gi
    requests.storage: 1Ti
    persistentvolumeclaims: "50"
    pods: "100"
    services: "50"
    secrets: "100"
    configmaps: "50"
    replicationcontrollers: "50"
    deployments.apps: "50"
    statefulsets.apps: "25"
    jobs.batch: "100"
    cronjobs.batch: "50"
    horizontalpodautoscalers.autoscaling: "25"