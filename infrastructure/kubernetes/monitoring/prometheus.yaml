---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sales-intelligence
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s
      external_labels:
        environment: production
        cluster: sales-intelligence

    scrape_configs:
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      - job_name: 'sales-platform-services'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: sales-platform
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      - job_name: 'database-metrics'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_component]
            regex: database
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    rule_files:
      - /etc/prometheus/rules/*.rules

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: sales-intelligence
  labels:
    app: prometheus
    component: rules
data:
  alerts.rules: |
    groups:
      - name: SalesPlatformAlerts
        rules:
          - alert: HighCPUUsage
            expr: container_cpu_usage_seconds_total > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High CPU usage detected
              description: Container CPU usage is above 80% for 5 minutes

          - alert: DatabaseLatency
            expr: postgresql_query_duration_seconds > 1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Database query latency high
              description: Database queries are taking longer than 1 second

          - alert: APILatencyHigh
            expr: http_request_duration_seconds{quantile="0.95"} > 0.5
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: API latency is high
              description: 95th percentile of API requests are taking longer than 500ms

          - alert: LeadScoringLatency
            expr: lead_scoring_duration_seconds > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Lead scoring latency high
              description: Lead scoring operations are taking longer than 2 seconds

          - alert: CacheHitRatioLow
            expr: redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) < 0.7
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Cache hit ratio is low
              description: Redis cache hit ratio is below 70% for 10 minutes

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: sales-intelligence
  labels:
    app: prometheus
    component: monitoring
spec:
  serviceName: prometheus
  replicas: 2
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.45.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "8Gi"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/
            - name: prometheus-rules
              mountPath: /etc/prometheus/rules/
            - name: prometheus-storage
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            timeoutSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 30
            timeoutSeconds: 30
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-rules
          configMap:
            name: prometheus-rules
  volumeClaimTemplates:
    - metadata:
        name: prometheus-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 100Gi

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sales-intelligence
  labels:
    app: prometheus
    component: monitoring
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  selector:
    app: prometheus

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prometheus-pdb
  namespace: sales-intelligence
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: prometheus