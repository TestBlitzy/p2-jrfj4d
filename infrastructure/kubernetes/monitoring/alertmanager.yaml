---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: sales-intelligence
  labels:
    app: alertmanager
    component: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.company.com:587'
      smtp_from: 'alertmanager@company.com'
      smtp_auth_username: '${SMTP_USERNAME}'
      smtp_auth_password: '${SMTP_PASSWORD}'
      slack_api_url: '${SLACK_WEBHOOK_URL}'
      pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

    templates:
      - '/etc/alertmanager/templates/*.tmpl'

    route:
      group_by: ['alertname', 'cluster', 'service', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'pager-duty-critical'
          group_wait: 0s
          repeat_interval: 1h
          continue: true
        - match:
            severity: warning
          receiver: 'slack-warnings'
          group_wait: 1m
          repeat_interval: 6h
        - match:
            service: database
          receiver: 'database-team'
          group_wait: 30s
        - match:
            service: ai-engine
          receiver: 'ml-team'
          group_wait: 30s

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'cluster', 'service']

    receivers:
      - name: 'default-receiver'
        slack_configs:
          - channel: '#monitoring-alerts'
            send_resolved: true
            title: '{{ template "custom_title" . }}'
            text: '{{ template "custom_description" . }}'

      - name: 'pager-duty-critical'
        pagerduty_configs:
          - service_key: '${PAGERDUTY_SERVICE_KEY}'
            description: '{{ template "pagerduty.default.description" . }}'
            severity: '{{ .CommonLabels.severity }}'
            class: '{{ .CommonLabels.service }}'
            group: '{{ .CommonLabels.cluster }}'
            
      - name: 'slack-warnings'
        slack_configs:
          - channel: '#system-warnings'
            send_resolved: true
            title: '{{ template "warning_title" . }}'
            text: '{{ template "warning_description" . }}'
            
      - name: 'database-team'
        slack_configs:
          - channel: '#db-alerts'
            send_resolved: true
            title: '[DB Alert] {{ .GroupLabels.alertname }}'
            text: '{{ template "custom_description" . }}'
        email_configs:
          - to: 'dba-team@company.com'
            send_resolved: true
            
      - name: 'ml-team'
        slack_configs:
          - channel: '#ai-alerts'
            send_resolved: true
            title: '[AI Alert] {{ .GroupLabels.alertname }}'
            text: '{{ template "custom_description" . }}'

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: sales-intelligence
  labels:
    app: alertmanager
    component: monitoring
data:
  default.tmpl: |
    {{ define "custom_title" }}
    [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}
    {{ end }}

    {{ define "custom_description" }}
    Alert: {{ .GroupLabels.alertname }}
    Severity: {{ .CommonLabels.severity }}
    Cluster: {{ .CommonLabels.cluster }}
    Service: {{ .CommonLabels.service }}
    Description: {{ .CommonAnnotations.description }}
    Runbook: {{ .CommonAnnotations.runbook_url }}
    {{ end }}

    {{ define "warning_title" }}
    [Warning] {{ .GroupLabels.alertname }}
    {{ end }}

    {{ define "warning_description" }}
    Warning Alert: {{ .GroupLabels.alertname }}
    Service: {{ .CommonLabels.service }}
    Description: {{ .CommonAnnotations.description }}
    {{ end }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: sales-intelligence
  labels:
    app: alertmanager
    component: monitoring
spec:
  serviceName: alertmanager
  replicas: 3
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.25.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--cluster.listen-address=0.0.0.0:9094"
            - "--cluster.peer=alertmanager-0.alertmanager:9094"
            - "--cluster.peer=alertmanager-1.alertmanager:9094"
            - "--cluster.peer=alertmanager-2.alertmanager:9094"
          ports:
            - containerPort: 9093
              name: http
            - containerPort: 9094
              name: cluster
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: templates
              mountPath: /etc/alertmanager/templates
            - name: storage
              mountPath: /alertmanager
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 30
            timeoutSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 30
            timeoutSeconds: 30
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: templates
          configMap:
            name: alertmanager-templates
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: sales-intelligence
  labels:
    app: alertmanager
    component: monitoring
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9093
      targetPort: 9093
    - name: cluster
      port: 9094
      targetPort: 9094
  selector:
    app: alertmanager

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager-pdb
  namespace: sales-intelligence
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: alertmanager