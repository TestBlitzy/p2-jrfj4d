apiVersion: v2
name: sales-intelligence-backend
description: Helm chart for Sales & Intelligence Platform backend service with AI-driven analytics and lead management capabilities
type: application
version: 1.0.0
appVersion: 1.0.0

keywords:
  - sales
  - intelligence
  - backend
  - api
  - ai-analytics
  - lead-management
  - enterprise

home: https://github.com/org/sales-intelligence

maintainers:
  - name: DevOps Team
    email: devops@sales-intelligence.com
    url: https://sales-intelligence.com/support

dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    tags:
      - database

  - name: redis
    version: 17.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    tags:
      - cache

  - name: rabbitmq
    version: 11.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
    tags:
      - queue

engine: gotpl